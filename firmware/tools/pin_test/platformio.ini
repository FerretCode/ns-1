; Standalone hardware bring-up test for the pad matrix + slider + shift
; button. Completely separate PlatformIO project from ../../ (the real
; firmware) — no Audio library, no SD, no TFT, no Encoder lib, nothing that
; could plausibly interfere. Build/flash it exactly the same way:
;
;   cd firmware/tools/pin_test
;   pio run -t upload
;   pio device monitor
;
; If this also shows nothing, the problem is upload/wiring/hardware, not
; anything in the main firmware's software stack.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
