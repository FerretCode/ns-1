; NS-1 firmware — Teensy 4.1 + Audio Shield Rev D
; https://docs.platformio.org/en/latest/boards/teensy/teensy41.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Teensy 4.1 @ 600MHz has plenty of headroom for the audio graph + float DSP.
upload_protocol = teensy-cli
board_build.f_cpu = 600000000L

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    paulstoffregen/Encoder @ ^1.4.4

monitor_speed = 115200
build_flags =
    -Wall
    -DAUDIO_BLOCK_SAMPLES=128
    ; USB_MIDI_AUDIO_SERIAL exposes: a USB-MIDI port, a USB Audio class device
    ; (this is what makes "sampling over USB-C" possible — the host DAW sees
    ; the NS-1 as a soundcard), and a USB-serial port for debug logging.
    ; This platformio-teensy version doesn't honor board_build.usb_type; the
    ; USB personality has to be selected as a CPPDEFINE directly.
    -DUSB_MIDI_AUDIO_SERIAL
